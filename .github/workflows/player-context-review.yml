name: Player replacement ownership review
on:
  push:
    branches: [codex/12934-replacement-review]
permissions:
  contents: read
jobs:
  node-regressions:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify unpatched replacement source
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = "16f29593915a7a8e44e7f7d74ec1ff27816337b363dc0edab45566f0117619b0"
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/player
      - name: Verify production source after build
        run: git diff --exit-code -- packages/core/src packages/player/src
      - name: Run existing ownership controls and new context regressions
        run: cd packages/player && mkdir -p test-results && bun test src/test/async-render-error.test.tsx src/test/custom-renderer-cancellation.test.tsx src/test/ownership-replacement.test.tsx --reporter=junit --reporter-outfile=./test-results/review-contexts.xml
      - name: Full Player and core tests
        run: |
          cd packages/player
          bun test src
          cd ../core
          bun test src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-replacement-review-baseline
          path: packages/player/test-results/
          if-no-files-found: error
          retention-days: 7
