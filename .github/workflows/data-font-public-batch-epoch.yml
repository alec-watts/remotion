name: Trace data-font cache during the full web renderer suite
on:
  push:
    branches: [codex/data-font-cache-full-suite]
permissions:
  contents: read
jobs:
  trace:
    if: github.repository == 'alec-watts/remotion'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Freeze browser inputs
        run: |
          bundle="$RUNNER_TEMP/Font Cache Chrome.app"
          ditto "/Applications/Google Chrome.app" "$bundle"
          chflags -R uchg "$bundle"
          binary="$bundle/Contents/MacOS/Google Chrome"
          echo "FONT_CACHE_CHROME=$binary" >> "$GITHUB_ENV"
          find "$bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/font-cache-chrome.sha256"
          python3 - <<'PIN'
          from pathlib import Path
          config = Path("packages/web-renderer/vitest.config.ts")
          source = config.read_text()
          marker = "channel: 'chrome',"
          assert source.count(marker) == 1
          config.write_text(source.replace(marker, marker + " executablePath: process.env.FONT_CACHE_CHROME,"))
          PIN
      - name: Run the upstream renderer command with cache tracing
        run: |
          git diff --exit-code 8c9241525789deb049200154f060be0ef5b35883 HEAD -- packages/web-renderer/src/drawing packages/web-renderer/src/render-still-on-web.tsx bun.lock
          mkdir -p qualification packages/web-renderer/test/__results__
          "$FONT_CACHE_CHROME" --version > qualification/chrome.txt
          shasum -a 256 packages/web-renderer/src/test/font-fingerprint-cache-browser.test.ts packages/web-renderer/src/test/fixtures/svg-titled-font-groups.tsx packages/web-renderer/src/drawing/fingerprint-css-font-groups.ts packages/web-renderer/src/drawing/font-fingerprint-cache.ts packages/web-renderer/src/test/native-reference.tsx packages/web-renderer/vitest.config.ts bun.lock > qualification/inputs.txt
          status=0
          bun run testwebrenderer --log-order=stream || status=$?
          if [ -d packages/web-renderer/test/__results__/font-batch-epoch ]; then
            mv packages/web-renderer/test/__results__/font-batch-epoch qualification/font-batch-epoch
          fi
          if [ -d packages/web-renderer/src/test/__screenshots__/native-pixel-failures ]; then
            mv packages/web-renderer/src/test/__screenshots__/native-pixel-failures qualification/native-pixel-failures
          fi
          shasum -a 256 --quiet -c "$RUNNER_TEMP/font-cache-chrome.sha256"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-font-cache-full-suite-macos
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release the frozen macOS browser
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Font Cache Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Font Cache Chrome.app"
          fi
