name: Compare direct shadow compositing on the destination
on:
  push:
    branches: [codex/shadow-destination-compositing]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Freeze browser inputs
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bundle="$RUNNER_TEMP/Shadow Trace Chrome.app"
            ditto "/Applications/Google Chrome.app" "$bundle"
            chflags -R uchg "$bundle"
            binary="$bundle/Contents/MacOS/Google Chrome"
          else
            bundle="$RUNNER_TEMP/shadow-trace-chrome"
            mkdir -p "$bundle"
            cp -RL /opt/google/chrome/. "$bundle/"
            binary="$bundle/chrome"
          fi
          echo "SHADOW_TRACE_CHROME=$binary" >> "$GITHUB_ENV"
          find "$bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/shadow-chrome.sha256"
          python3 - <<'PIN'
          from pathlib import Path
          config = Path("packages/web-renderer/vitest.config.ts")
          source = config.read_text()
          marker = "channel: 'chrome',"
          assert source.count(marker) == 1
          config.write_text(source.replace(marker, marker + " executablePath: process.env.SHADOW_TRACE_CHROME,"))
          PIN
      - name: Compare both shadow producers on one runner
        run: |
          patch="$RUNNER_TEMP/shadow-caster.patch"
          git diff --binary HEAD^ HEAD -- packages/web-renderer/src/drawing/draw-box-shadow.ts > "$patch"
          test -s "$patch"
          failed=0
          for arm in candidate control; do
            if [ "$arm" = control ]; then
              git apply --reverse "$patch"
              git diff --exit-code HEAD^ -- packages/web-renderer/src/drawing bun.lock
            fi
            bunx turbo run make --filter=@remotion/web-renderer
            mkdir -p "qualification/$arm" packages/web-renderer/test/__results__
            cp "$patch" "qualification/$arm/producer.patch"
            "$SHADOW_TRACE_CHROME" --version > "qualification/$arm/chrome.txt"
            shasum -a 256 packages/web-renderer/src/drawing/draw-box-shadow.ts > "qualification/$arm/producer.txt"
            shasum -a 256 packages/web-renderer/src/test/box-shadow-native.test.tsx packages/web-renderer/src/test/native-reference.tsx packages/web-renderer/vitest.config.ts bun.lock > "qualification/$arm/inputs.txt"
            (cd packages/web-renderer && bunx vitest src/test/box-shadow-native.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/shadow-coverage.json) || failed=1
            mv packages/web-renderer/test/__results__ "qualification/$arm/web-renderer"
          done
          cmp qualification/candidate/inputs.txt qualification/control/inputs.txt
          cmp qualification/candidate/chrome.txt qualification/control/chrome.txt
          shasum -a 256 --quiet -c "$RUNNER_TEMP/shadow-chrome.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-destination-compositing-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release the frozen macOS browser
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Shadow Trace Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Shadow Trace Chrome.app"
          fi
