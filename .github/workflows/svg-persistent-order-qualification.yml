name: SVG persistent font order qualification
on:
  push:
    branches: [codex/13117-late-external-carrier]
permissions:
  contents: read
jobs:
  fonts:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify candidate inputs and restore the original producer for baseline
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = 0ba3fd193fbd39b20a42248e66f4d32ee43277c39e3328e0e57487b8a1c8f892
          git fetch --no-tags --depth=1 origin bd1a1332fa26bab7a3a3e2ff5da5fad9106c39f6
          if test "$ARM" = baseline; then
            git restore --source=bd1a1332fa26bab7a3a3e2ff5da5fad9106c39f6 -- packages/web-renderer/src/drawing/svg-font-css-for-carrier.ts packages/web-renderer/src/drawing/turn-svg-into-drawable.ts packages/web-renderer/src/test/svg-font-css-for-carrier.test.ts
          fi
          mkdir -p packages/web-renderer/test/__results__/source
          git rev-parse HEAD > packages/web-renderer/test/__results__/source/head.txt
          git diff --name-only > packages/web-renderer/test/__results__/source/restored-paths.txt
          shasum -a 256 packages/web-renderer/src/drawing/svg-font-css-for-carrier.ts packages/web-renderer/src/drawing/turn-svg-into-drawable.ts > packages/web-renderer/test/__results__/source/producer.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Retain earlier font cohorts and compare persistent order against native and literal controls
        run: cd packages/web-renderer && bunx vitest src/test/svg-font-css-for-carrier.test.ts src/test/svg-persistent-font-order.test.tsx src/test/svg-titled-data-font.test.tsx src/test/svg-font-definition-review.test.tsx src/test/svg-precompose-font.test.tsx src/test/svg-inactive-titled-font.test.tsx src/test/svg-paint-resource-font.test.tsx src/test/svg-css-import-font.test.ts src/test/svg-css-url-font.test.ts --run --reporter=default --reporter=json --outputFile=./test/__results__/persistent-order.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-persistent-order-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
