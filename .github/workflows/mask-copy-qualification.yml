name: SVG image mask qualification
on:
  push:
    branches: [codex/13134-mask-copy-qualification]
  pull_request:
    branches: [codex/css-gradient-mask-layers]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  mask:
    if: github.repository == 'alec-watts/remotion'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, identity, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore only the original mask copy in baseline
        env:
          ARM: ${{ matrix.arm }}
        run: |
          git fetch --no-tags --depth=1 origin 886e6f2337e52ca0b48ee5b2920ad313b3ca2fe6 1a98e835718a394bf9350dccce13b78927980d7f
          if test "$ARM" = baseline; then
            git restore --source=886e6f2337e52ca0b48ee5b2920ad313b3ca2fe6 -- packages/web-renderer/src/drawing/handle-mask.ts packages/web-renderer/src/drawing/css-mask.ts
          elif test "$ARM" = identity; then
            git restore --source=1a98e835718a394bf9350dccce13b78927980d7f -- packages/web-renderer/src/drawing/handle-mask.ts packages/web-renderer/src/drawing/css-mask.ts
          fi
          mkdir -p packages/web-renderer/test/__results__/source
          git rev-parse HEAD > packages/web-renderer/test/__results__/source/head.txt
          git diff --name-status HEAD > packages/web-renderer/test/__results__/source/restored-paths.txt
          shasum -a 256 packages/web-renderer/src/drawing/handle-mask.ts packages/web-renderer/src/drawing/css-mask.ts > packages/web-renderer/test/__results__/source/producer.txt
          git diff --exit-code HEAD -- packages/web-renderer/src/test package.json bun.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Keep strict native fractional edges and existing mask snapshots
        run: cd packages/web-renderer && bunx vitest src/test/mask-copy-qualification.test.tsx src/test/mask-gradient-layers.test.tsx src/test/mask-image.test.tsx src/test/mask-image-url.test.tsx src/test/mask-image-url-sizing.test.tsx src/test/backface-visibility-mask.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/mask-copy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-image-mask-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
