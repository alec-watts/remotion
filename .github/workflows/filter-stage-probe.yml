name: Filter stage noninterference probe
on:
  push:
    branches: [codex/12686-filter-stage-probe]
permissions:
  contents: read
jobs:
  stages:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify package inputs and unchanged producer
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = "b2691df690bf2e01a4f299285582c575e2516b4c291e5115a263ce8147a74784"
          git fetch --no-tags --depth=1 origin 66613b6001396d88a2d57b4347772a564897ae7a
          git diff --exit-code 66613b6001396d88a2d57b4347772a564897ae7a -- packages/web-renderer/src/drawing packages/web-renderer/src/compose.ts packages/web-renderer/src/take-screenshot.ts
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Preserve the full strict cohort and verify instrumentation
        run: cd packages/web-renderer && bunx vitest src/test/filter-capture-viewport.test.ts src/test/affine-filter-input-review.test.tsx src/test/affine-filter-stress.test.tsx src/test/affine-filter-stage-probe.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/filter-stage-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-stage-probe
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: error
          retention-days: 7
