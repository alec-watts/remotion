name: Retained paint owner qualification
on:
  push:
    branches: [codex/12934-retained-paint-owner]
permissions:
  contents: read
jobs:
  ownership:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Guard exact source and restore only baseline producer
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = eee2911d9739754b8d9a18d8e06c5759aaa6591867992e6f055d156efd59b9ba
          git fetch --no-tags --depth=1 origin 5583366db1ee262dc79e460513c904550740b508
          if test "$ARM" = baseline; then
            git show 5583366db1ee262dc79e460513c904550740b508:packages/core/src/HtmlInCanvas.tsx > packages/core/src/HtmlInCanvas.tsx
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/player
      - run: cd packages/core && bun run lint
      - run: cd packages/player && bun run lint
      - name: Original and replacement paint lifecycle regressions
        run: |
          mkdir -p validation
          set -o pipefail
          cd packages/core
          bun test src/test/html-in-canvas.test.tsx 2>&1 | tee ../../validation/html-in-canvas.log
      - name: Full core suite
        if: matrix.arm == 'candidate'
        run: cd packages/core && bun test src/test
      - name: Full Player suite
        if: matrix.arm == 'candidate'
        run: cd packages/player && bun test src/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-paint-owner-${{ matrix.arm }}
          path: validation/
          if-no-files-found: warn
          retention-days: 7
