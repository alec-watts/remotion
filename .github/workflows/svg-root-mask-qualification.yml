name: SVG root mask resource qualification
on:
  push:
    branches: [codex/13102-svg-root-mask]
permissions:
  contents: read
jobs:
  masks:
    if: github.repository == 'alec-watts/remotion'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify package source and restore only the baseline producer
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = 6f8c4d5b53e26f7f32900fbf935e3ea98ebace4b32c114155aa08eb19f4f893c
          git fetch --no-tags --depth=1 origin 5f620a8c30321d590ed20c758d0a53811d5f117d
          if test "$ARM" = baseline; then
            git restore --source=5f620a8c30321d590ed20c758d0a53811d5f117d -- packages/web-renderer/src/drawing/calculate-transforms.ts packages/web-renderer/src/drawing/handle-mask.ts packages/web-renderer/src/drawing/mask-image.ts packages/web-renderer/src/drawing/turn-svg-into-drawable.ts
            rm packages/web-renderer/src/drawing/svg-mask.ts
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Preserve all original mask, resource and URL-font comparisons
        run: cd packages/web-renderer && bunx vitest src/test/svg-root-mask-geometry.test.tsx src/test/svg-font-definition-review.test.tsx src/test/svg-css-url-font.test.ts src/test/svg-css-font-usage-cache.test.tsx src/test/mask-image.test.tsx src/test/mask-image-url.test.tsx src/test/mask-image-url-sizing.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/svg-root-mask.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-root-mask-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
