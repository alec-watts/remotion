name: SVG font technology hint qualification
on:
  push:
    branches: [codex/13117-font-tech-hints]
permissions:
  contents: read
jobs:
  fonts:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and restore only the baseline producer
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = 2ce0af272eca838b103ccff1faa8a398fdbcfc3a861a51747f2fc4d24fe15286
          git fetch --no-tags --depth=1 origin 81edd30a29bfbd3dd6c56d2c58785c40f44dd340
          if test "$ARM" = baseline; then
            git restore --source=81edd30a29bfbd3dd6c56d2c58785c40f44dd340 -- packages/web-renderer/src/drawing/turn-svg-into-drawable.ts
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Qualify real loaded tech-hinted fonts and retain definition controls
        run: cd packages/web-renderer && bunx vitest src/test/svg-font-css-for-carrier.test.ts src/test/single-source-font-url.test.ts src/test/svg-font-tech-hints.test.ts src/test/svg-font-definition-review.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/font-tech-hints.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-font-tech-hints-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
