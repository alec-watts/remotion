name: SVG paint resource font snapshot qualification
on:
  push:
    branches: [codex/13117-resource-font-snapshot]
permissions:
  contents: read
jobs:
  fonts:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and restore only the baseline producer
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = 7e48a69ee901a272376109d58adbb077d75d2fe9b670ce591c39128662187c7c
          git fetch --no-tags --depth=1 origin a31b226f360e5ffadda4cc2f8a41bbf0ab30efcb
          if test "$ARM" = baseline; then
            git restore --source=a31b226f360e5ffadda4cc2f8a41bbf0ab30efcb -- packages/web-renderer/src/drawing/turn-svg-into-drawable.ts
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Preserve definition and use controls alongside resource regression
        run: cd packages/web-renderer && bunx vitest src/test/svg-font-definition-review.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/paint-resource-font.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-paint-resource-font-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
