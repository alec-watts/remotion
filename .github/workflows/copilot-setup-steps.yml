name: Windows docs timing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'alec-watts/remotion'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BUN_INSTALL_CACHE_DIR: 'D:\.bun\install\cache'
      FORCE_COLOR: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_NO_UPDATE_NOTIFIER: '1'
      TURBO_SCM_BASE: f4d77d2aa7d96d7febb5c2090cbbb7f0ee2c89e3
      TURBO_SCM_HEAD: b0e253519b209de544e39a66eff304d6bc9feff0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: capsule
          persist-credentials: false
      - name: Create diagnostic output
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/evidence" | Out-Null
      - name: Enable Git long paths for upstream branch refs
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          repository: remotion-dev/remotion
          ref: b0e253519b209de544e39a66eff304d6bc9feff0
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 16.20.2
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - name: Verify exact tested source and tools
        working-directory: source
        shell: pwsh
        run: |
          if ((node --version) -ne 'v16.20.2') { throw 'Unexpected Node version' }
          if ((bun --version) -ne '1.4.3') { throw 'Unexpected Bun version' }
          if ((git rev-parse HEAD) -ne 'b0e253519b209de544e39a66eff304d6bc9feff0') { throw 'Unexpected source commit' }
          if ((git rev-parse 'HEAD^{tree}') -ne '4af3cf573e2ced9c22fead0ea7ac20ee7cd0e33a') { throw 'Unexpected source tree' }
          python ../capsule/.github/diagnostics/docs-mdx-timing/verify-capsule.py ../capsule/.github/diagnostics/docs-mdx-timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD 'HEAD^{tree}' | Out-File "$env:GITHUB_WORKSPACE/evidence/source.txt"
          node --version | Out-File "$env:GITHUB_WORKSPACE/evidence/tools.txt"
          bun --version | Out-File -Append "$env:GITHUB_WORKSPACE/evidence/tools.txt"
      - name: Cache Bun dependencies (Windows)
        uses: actions/cache@v5
        with:
          path: D:\.bun\install\cache
          key: windows-latest-bun-${{ hashFiles('source/**/bun.lock') }}
          restore-keys: windows-latest-bun-
      - name: Install original frozen dependencies
        working-directory: source
        shell: pwsh
        run: |
          & bun ci *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/evidence/install.log"
          exit $LASTEXITCODE
      - name: Cache Turbo
        uses: rharkor/caching-for-turbo@0abc2381e688c4d2832f0665a68a01c6e82f0d6c
      - name: Original affected build command
        timeout-minutes: 30
        working-directory: source
        shell: pwsh
        run: |
          & bunx turbo run make --affected --concurrency=2 --no-update-notifier *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/evidence/build.log"
          exit $LASTEXITCODE
      - name: Apply observer only
        shell: pwsh
        run: |
          python capsule/.github/diagnostics/docs-mdx-timing/instrument.py source "$env:GITHUB_WORKSPACE/evidence/mdx-timing.jsonl" | Tee-Object "$env:GITHUB_WORKSPACE/evidence/instrumentation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C source diff -- packages/docs/src/test/elements.test.ts | Out-File "$env:GITHUB_WORKSPACE/evidence/observer.patch"
      - name: Original affected test command
        timeout-minutes: 30
        working-directory: source
        shell: pwsh
        run: |
          & bunx turbo run test --affected --concurrency=1 --no-update-notifier *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/evidence/tests.log"
          exit $LASTEXITCODE
      - name: Restore original observed source
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/evidence/observer-state.json") {
            python capsule/.github/diagnostics/docs-mdx-timing/instrument.py source "$env:GITHUB_WORKSPACE/evidence/mdx-timing.jsonl" --restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Summarize observed execution
        if: always()
        shell: pwsh
        run: python capsule/.github/diagnostics/docs-mdx-timing/summarize.py "$env:GITHUB_WORKSPACE/evidence"
      - name: Retain observations on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-docs-mdx-timing
          path: evidence
          retention-days: 7
          if-no-files-found: warn
