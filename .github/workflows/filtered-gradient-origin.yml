name: Filtered gradient origin comparison
on:
  push:
    branches: [codex/filtered-gradient-origin]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 5
      - name: Freeze the complete Chrome bundle
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            diagnostic_bundle="$RUNNER_TEMP/Remotion Gradient Chrome.app"
            ditto "/Applications/Google Chrome.app" "$diagnostic_bundle"
            chflags -R uchg "$diagnostic_bundle"
            diagnostic_executable="$diagnostic_bundle/Contents/MacOS/Google Chrome"
          else
            diagnostic_bundle="$RUNNER_TEMP/remotion-gradient-chrome"
            mkdir -p "$diagnostic_bundle"
            cp -RL /opt/google/chrome/. "$diagnostic_bundle/"
            diagnostic_executable="$diagnostic_bundle/chrome"
          fi
          echo "REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE=$diagnostic_executable" >> "$GITHUB_ENV"
          find "$diagnostic_bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
      - run: python3 .github/scripts/pin-gradient-chrome.py
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Capture filter inputs on the immutable runner
        run: |
          diagnostic_failed=0
          diagnostic_arm=observed
          mkdir -p "qualification/$diagnostic_arm" packages/web-renderer/test/__results__/inputs
          git diff abba30cd0801f5d2290bf018e0b60711fc37613e HEAD -- packages/web-renderer/src/drawing > packages/web-renderer/test/__results__/inputs/producer.patch
          cp packages/web-renderer/src/drawing/process-node.ts packages/web-renderer/src/drawing/get-precomposed-layer-geometry.ts packages/web-renderer/src/drawing/transform.ts packages/web-renderer/src/drawing/draw-background.ts packages/web-renderer/src/take-screenshot.ts packages/web-renderer/src/drawing/raster-scale.ts packages/web-renderer/src/drawing/css-filter-to-svg.ts packages/web-renderer/src/drawing/rasterize-css-filter.ts packages/web-renderer/test/__results__/inputs/
          shasum -a 256 packages/web-renderer/src/drawing/process-node.ts packages/web-renderer/src/drawing/get-precomposed-layer-geometry.ts packages/web-renderer/src/drawing/transform.ts packages/web-renderer/src/drawing/draw-background.ts packages/web-renderer/src/take-screenshot.ts packages/web-renderer/src/drawing/clip-filter-inputs.ts packages/web-renderer/src/drawing/raster-scale.ts packages/web-renderer/src/drawing/css-filter-to-svg.ts packages/web-renderer/src/drawing/rasterize-css-filter.ts > packages/web-renderer/test/__results__/inputs/producer.txt
          shasum -a 256 packages/web-renderer/src/test/projective-filter-input.test.tsx packages/web-renderer/src/test/fixtures/projective-filter-input.tsx packages/web-renderer/src/test/preserve-3d-depth.test.tsx packages/web-renderer/src/test/fixtures/preserve-3d-depth.tsx packages/web-renderer/src/test/native-reference.tsx packages/web-renderer/vitest.config.ts bun.lock > packages/web-renderer/test/__results__/inputs/test-inputs.txt
          git diff --exit-code HEAD -- packages/web-renderer/src/test bun.lock
          bunx turbo run make --filter=@remotion/web-renderer
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-before.txt
          cp "$RUNNER_TEMP/remotion-gradient-chrome.sha256" packages/web-renderer/test/__results__/chrome.sha256
          node -e 'const os=require("node:os");process.stdout.write(JSON.stringify({cpu:os.cpus()[0].model,cores:os.availableParallelism(),memory:os.totalmem()}))' > packages/web-renderer/test/__results__/runner.json
          (cd packages/web-renderer && bun ./test/browser-info.ts) > packages/web-renderer/test/__results__/browser-info.txt 2>&1
          cat packages/web-renderer/test/__results__/browser-info.txt
          if (cd packages/web-renderer && bunx vitest src/test/projective-filter-input.test.tsx src/test/preserve-3d-depth.test.tsx src/test/3d-grid-sampler.test.ts src/test/3d-flattening.test.tsx src/test/transforms.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/projective-filter-suite.json); then
            diagnostic_exit=0
          else
            diagnostic_exit=$?
            diagnostic_failed=1
          fi
          printf '%s\n' "$diagnostic_exit" > "qualification/$diagnostic_arm/exit-code.txt"
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-after.txt
          mv packages/web-renderer/test/__results__ "qualification/$diagnostic_arm/web-renderer"
          if [ -d packages/web-renderer/.vitest/attachments ]; then
            mv packages/web-renderer/.vitest/attachments "qualification/$diagnostic_arm/attachments"
          fi
          if [ -d packages/web-renderer/src/test/__screenshots__/native-pixel-failures ]; then
            mv packages/web-renderer/src/test/__screenshots__/native-pixel-failures "qualification/$diagnostic_arm/native-pixel-failures"
          fi
          exit "$diagnostic_failed"
      - name: Verify browser remains frozen
        if: always()
        run: |
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-gradient-origin-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release immutable diagnostic bundle for runner cleanup
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -d "$RUNNER_TEMP/Remotion Gradient Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Remotion Gradient Chrome.app"
          fi
