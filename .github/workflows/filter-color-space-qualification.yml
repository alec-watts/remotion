name: Modern color shadow bounds qualification
on:
  push:
    branches: [codex/filter-color-space-outsets]
permissions:
  contents: read
jobs:
  fonts:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and restore only the baseline producer
        env:
          ARM: ${{ matrix.arm }}
        run: |
          actual=$(git ls-tree -r -z HEAD -- packages package.json bun.lock turbo.json .github/scripts .github/workflows/push.yml | shasum -a 256 | cut -d ' ' -f 1)
          test "$actual" = aab9fc0d6c0f18168cf3e4ff50d0d8dfd3aabc89a2a7285e6b186bf8639e8c45
          git fetch --no-tags --depth=1 origin dba0f868a294f41138c322f42644d0b1663feb1c
          if test "$ARM" = baseline; then
            git restore --source=dba0f868a294f41138c322f42644d0b1663feb1c -- packages/web-renderer/src/drawing/filter-outsets.ts
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Measure modern shadow colors against native and literal controls
        run: cd packages/web-renderer && bunx vitest src/test/filter-outsets.test.ts src/test/filter-color-space-shadow.test.tsx src/test/filter-image.test.tsx src/test/filter-line-height-clip.test.tsx src/test/filter-text.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/filter-color-space.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-color-space-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: warn
          retention-days: 7
