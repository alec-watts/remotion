name: Qualify native projective capture on Chrome 157
on:
  push:
    branches: [codex/qualify-3d-native-chrome157]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch the pinned public renderer producer
        run: git fetch --no-tags --depth=1 origin 7ebcc9f8d48ae0071fe5a85afe3e884e86708a30
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Freeze browser inputs
        run: |
          bundle="$RUNNER_TEMP/projective-chrome157"
          archive="$RUNNER_TEMP/projective-chrome157.zip"
          mkdir -p "$bundle"
          if [ "$RUNNER_OS" = macOS ]; then
            curl --fail --location --silent --show-error https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.79/mac-arm64/chrome-mac-arm64.zip --output "$archive"
            ditto -x -k "$archive" "$bundle"
            binary="$bundle/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
            chflags -R uchg "$bundle"
          else
            curl --fail --location --silent --show-error https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.79/linux64/chrome-linux64.zip --output "$archive"
            unzip -q "$archive" -d "$bundle"
            binary="$bundle/chrome-linux64/chrome"
          fi
          version="$("$binary" --version)"
          case "$version" in *157.0.8103.79*) ;; *) exit 1 ;; esac
          echo "VERTICAL_TEXT_TRACE_CHROME=$binary" >> "$GITHUB_ENV"
          find "$bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/projective-svg-chrome.sha256"
          python3 - <<'PIN'
          from pathlib import Path
          config = Path("packages/web-renderer/vitest.config.ts")
          source = config.read_text()
          marker = "channel: 'chrome',"
          assert source.count(marker) == 1
          config.write_text(source.replace(marker, marker + " executablePath: process.env.VERTICAL_TEXT_TRACE_CHROME,"))
          PIN
      - name: Record selected runtime and native capture availability
        run: |
          mkdir -p qualification
          cd packages/web-renderer
          bun --eval '
          import {chromium} from "playwright";
          const browser = await chromium.launch({executablePath: process.env.VERTICAL_TEXT_TRACE_CHROME, headless: true});
          try {
            const session = await browser.newBrowserCDPSession();
            const {gpu} = await session.send("SystemInfo.getInfo");
            const page = await browser.newPage();
            const native = await page.evaluate(() => {
              const canvas = document.createElement("canvas");
              return {drawElementImage: typeof canvas.getContext("2d")?.drawElementImage === "function", requestPaint: typeof canvas.requestPaint === "function"};
            });
            await Bun.write("../../qualification/browser.json", JSON.stringify({version: browser.version(), native, gpu}, null, 2));
            if (!native.drawElementImage || !native.requestPaint) throw new Error("The selected Chrome build does not expose the native path; do not count skipped blur tests as qualification");
          } finally {
            await browser.close();
          }
          '
      - name: Capture public 3D renderer and existing SVG paths
        run: |
          mkdir -p qualification
          git rev-parse HEAD > qualification/revision.txt
          git rev-parse HEAD:packages/web-renderer/src/drawing > qualification/drawing-tree.txt
          git diff --exit-code 7ebcc9f8d48ae0071fe5a85afe3e884e86708a30 HEAD -- packages/web-renderer/src/drawing
          python3 - <<'HASH'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '-z', 'packages/web-renderer/src', 'packages/web-renderer/vitest.config.ts', 'packages/web-renderer/package.json', 'bun.lock']).decode().split('\0')
          with Path('qualification/inputs.sha256').open('w') as output:
              for file in files:
                  if file:
                      output.write(hashlib.sha256(Path(file).read_bytes()).hexdigest() + '  ' + file + '\n')
          HASH
          "$VERTICAL_TEXT_TRACE_CHROME" --version > qualification/chrome.txt
          bunx turbo run make --filter=@remotion/web-renderer
          status=0
          (cd packages/web-renderer && bunx vitest src/test/projective-filter-svg-carrier.test.tsx src/test/projective-filter-input.test.tsx src/test/preserve-3d-depth.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/report.json) || status=$?
          mv packages/web-renderer/test/__results__ qualification/web-renderer
          if [ -d packages/web-renderer/.vitest/attachments ]; then mv packages/web-renderer/.vitest/attachments qualification/snapshot-attachments; fi
          printf '%s\n' "$status" > qualification/status.txt
          shasum -a 256 --quiet -c qualification/inputs.sha256
          shasum -a 256 --quiet -c "$RUNNER_TEMP/projective-svg-chrome.sha256"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projective-native-chrome157-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release frozen macOS browser
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/projective-chrome157" ]; then
            chflags -R nouchg "$RUNNER_TEMP/projective-chrome157"
          fi
