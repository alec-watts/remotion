name: Trace native sharp shadow layer bounds
on:
  push:
    branches: [codex/3d-native-shadow-layer-extent]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Freeze the complete Chrome bundle
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            diagnostic_bundle="$RUNNER_TEMP/Remotion Gradient Chrome.app"
            ditto "/Applications/Google Chrome.app" "$diagnostic_bundle"
            chflags -R uchg "$diagnostic_bundle"
            diagnostic_executable="$diagnostic_bundle/Contents/MacOS/Google Chrome"
          else
            diagnostic_bundle="$RUNNER_TEMP/remotion-gradient-chrome"
            mkdir -p "$diagnostic_bundle"
            cp -RL /opt/google/chrome/. "$diagnostic_bundle/"
            diagnostic_executable="$diagnostic_bundle/chrome"
          fi
          echo "REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE=$diagnostic_executable" >> "$GITHUB_ENV"
          find "$diagnostic_bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
      - run: python3 .github/scripts/pin-gradient-chrome.py
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Compare the sharp shadow at fixed destination geometry
        run: |
          git diff --exit-code HEAD^ -- packages/web-renderer/src/drawing packages/web-renderer/src/take-screenshot.ts bun.lock
          mkdir -p packages/web-renderer/test/__results__/inputs
          shasum -a 256 packages/web-renderer/src/drawing/process-node.ts packages/web-renderer/src/drawing/rasterize-css-filter.ts packages/web-renderer/src/test/sharp-shadow-sampling.test.tsx packages/web-renderer/src/test/fixtures/sharp-shadow-sampling.tsx packages/web-renderer/src/test/native-reference.tsx packages/web-renderer/vitest.config.ts bun.lock > packages/web-renderer/test/__results__/inputs/source.txt
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-before.txt
          cp "$RUNNER_TEMP/remotion-gradient-chrome.sha256" packages/web-renderer/test/__results__/chrome.sha256
          failed=0
          (cd packages/web-renderer && bunx vitest src/test/sharp-shadow-sampling.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/sharp-shadow-caster.json) || failed=$?
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-after.txt
          mv packages/web-renderer/test/__results__ qualification
          exit "$failed"
      - name: Verify browser remains frozen
        if: always()
        run: |
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-native-shadow-layer-extent-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release immutable diagnostic bundle for runner cleanup
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -d "$RUNNER_TEMP/Remotion Gradient Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Remotion Gradient Chrome.app"
          fi
