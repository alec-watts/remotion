name: SVG color stage diagnostic
on:
  push:
    branches: [codex/css-filter-svg-fallback-qualification]
    paths:
      - 'packages/web-renderer/src/test/svg-filter-color-stage-qualification.test.tsx'
      - 'packages/web-renderer/src/test/svg-css-filter-color-stage-qualification.test.tsx'
      - '.github/workflows/svg-color-stage-diagnostic.yml'
permissions:
  contents: read
jobs:
  colors:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps chromium firefox webkit
      - name: Retain exact stage test identity
        run: |
          mkdir -p packages/web-renderer/test/__results__
          shasum -a 256 packages/web-renderer/src/test/svg-css-filter-color-stage-qualification.test.tsx packages/web-renderer/src/test/svg-filter-color-stage-qualification.test.tsx packages/web-renderer/src/drawing/turn-svg-into-drawable.ts > packages/web-renderer/test/__results__/color-stage-hashes.txt
      - name: Compare source colors through identity filter stages
        run: cd packages/web-renderer && bunx vitest src/test/svg-filter-color-stage-qualification.test.tsx src/test/svg-css-filter-color-stage-qualification.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/color-stage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-color-stages-${{ matrix.os }}
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: error
          retention-days: 7
