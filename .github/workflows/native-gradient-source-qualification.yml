name: Native gradient source qualification
on:
  push:
    branches: [codex/native-gradient-source-qualification]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        arm: [baseline, candidate]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Freeze the complete Chrome bundle
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            diagnostic_bundle="$RUNNER_TEMP/Remotion Gradient Chrome.app"
            ditto "/Applications/Google Chrome.app" "$diagnostic_bundle"
            chflags -R uchg "$diagnostic_bundle"
            diagnostic_executable="$diagnostic_bundle/Contents/MacOS/Google Chrome"
          else
            diagnostic_bundle="$RUNNER_TEMP/remotion-gradient-chrome"
            mkdir -p "$diagnostic_bundle"
            cp -RL /opt/google/chrome/. "$diagnostic_bundle/"
            diagnostic_executable="$diagnostic_bundle/chrome"
          fi
          echo "REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE=$diagnostic_executable" >> "$GITHUB_ENV"
          find "$diagnostic_bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
      - run: python3 .github/scripts/pin-gradient-chrome.py
      - name: Select only the gradient paint producer
        run: |
          git fetch --no-tags --depth=1 origin b0c3781e6acc736aeaf2102511068094032ea061
          if [ '${{ matrix.arm }}' = baseline ]; then
            git restore --source=b0c3781e6acc736aeaf2102511068094032ea061 -- packages/web-renderer/src/drawing/draw-background.ts
          fi
          mkdir -p packages/web-renderer/test/__results__/inputs
          git diff HEAD -- packages/web-renderer/src/drawing > packages/web-renderer/test/__results__/inputs/producer.patch
          shasum -a 256 packages/web-renderer/src/drawing/draw-background.ts > packages/web-renderer/test/__results__/inputs/producer.txt
          shasum -a 256 packages/web-renderer/src/test/linear-gradient-native-qualification.test.tsx packages/web-renderer/src/test/fixtures/linear-gradient.tsx packages/web-renderer/src/test/native-reference.tsx packages/web-renderer/vitest.config.ts bun.lock > packages/web-renderer/test/__results__/inputs/test-inputs.txt
          git diff --exit-code HEAD -- packages/web-renderer/src/test bun.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: bunx turbo run make --filter=@remotion/web-renderer
      - run: cd packages/web-renderer && bun run lint
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Record actual browser and runner metadata
        run: |
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-before.txt
          cp "$RUNNER_TEMP/remotion-gradient-chrome.sha256" packages/web-renderer/test/__results__/chrome.sha256
          node -e 'const os=require("node:os");process.stdout.write(JSON.stringify({cpu:os.cpus()[0].model,cores:os.availableParallelism(),memory:os.totalmem()}))' > packages/web-renderer/test/__results__/runner.json
          cd packages/web-renderer
          bun ./test/browser-info.ts > test/__results__/browser-info.txt 2>&1
          cat test/__results__/browser-info.txt
      - name: Keep native and original interaction gates
        run: cd packages/web-renderer && bunx vitest src/test/linear-gradient-native-qualification.test.tsx src/test/linear-gradient.test.tsx src/test/gradient-transparent-keyword.test.tsx src/test/background-clip.test.tsx src/test/background-blend-mode.test.tsx src/test/box-shadow.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/native-gradient-suite.json
      - name: Verify browser remains frozen
        if: always()
        run: |
          shasum -a 256 --quiet -c "$RUNNER_TEMP/remotion-gradient-chrome.sha256"
          "$REMOTION_DIAGNOSTIC_CHROME_EXECUTABLE" --version > packages/web-renderer/test/__results__/chrome-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gradient-${{ matrix.os }}-${{ matrix.arm }}
          include-hidden-files: true
          path: |
            packages/web-renderer/test/__results__/
            packages/web-renderer/.vitest/attachments/
            packages/web-renderer/src/test/__screenshots__/native-pixel-failures/
          if-no-files-found: error
          retention-days: 7
      - name: Release immutable diagnostic bundle for runner cleanup
        if: always()
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -d "$RUNNER_TEMP/Remotion Gradient Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Remotion Gradient Chrome.app"
          fi
