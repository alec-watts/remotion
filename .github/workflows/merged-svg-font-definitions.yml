name: Qualify local SVG root mask routing
on:
  push:
    branches: [codex/qualify-local-svg-root-mask]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Freeze browser inputs
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bundle="$RUNNER_TEMP/Vertical Text Trace Chrome.app"
            ditto "/Applications/Google Chrome.app" "$bundle"
            chflags -R uchg "$bundle"
            binary="$bundle/Contents/MacOS/Google Chrome"
          else
            bundle="$RUNNER_TEMP/vertical-text-trace-chrome"
            mkdir -p "$bundle"
            cp -RL /opt/google/chrome/. "$bundle/"
            binary="$bundle/chrome"
          fi
          echo "VERTICAL_TEXT_TRACE_CHROME=$binary" >> "$GITHUB_ENV"
          find "$bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/vertical-text-chrome.sha256"
          python3 - <<'PIN'
          from pathlib import Path
          config = Path("packages/web-renderer/vitest.config.ts")
          source = config.read_text()
          marker = "channel: 'chrome',"
          assert source.count(marker) == 1
          config.write_text(source.replace(marker, marker + " executablePath: process.env.VERTICAL_TEXT_TRACE_CHROME,"))
          PIN
      - name: Compare local SVG mask routing on the same browser inputs
        run: |
          drawing=packages/web-renderer/src/drawing
          producers=("$drawing/calculate-transforms.ts" "$drawing/mask-image.ts")
          inputs=("$drawing/embed-registered-fonts-in-svg.ts" "$drawing/turn-svg-into-drawable.ts" packages/web-renderer/src/test/{fixtures/svg-font-definition-review,merged-svg-font-definitions.test,native-reference,svg-css-font.test}.tsx packages/web-renderer/vitest.config.ts packages/example/public/bangers.woff2 bun.lock)
          mkdir -p qualification
          "$VERTICAL_TEXT_TRACE_CHROME" --version > qualification/chrome.txt
          shasum -a 256 "${inputs[@]}" > qualification/inputs.sha256
          git rev-parse HEAD^ HEAD > qualification/revisions.txt
          failed=0
          for arm in baseline candidate; do
            rev=HEAD
            if [ "$arm" = baseline ]; then rev=HEAD^; fi
            git restore --source="$rev" -- "${producers[@]}"
            folder="qualification/$arm"
            mkdir -p "$folder" packages/web-renderer/test/__results__
            cp qualification/revisions.txt "$folder/"
            shasum -a 256 "${producers[@]}" > "$folder/producer.sha256"
            bunx turbo run make --filter=@remotion/web-renderer
            status=0
            (cd packages/web-renderer && bunx vitest src/test/merged-svg-font-definitions.test.tsx src/test/svg-css-font.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/report.json) || status=$?
            mv packages/web-renderer/test/__results__ "$folder/web-renderer"
            printf "%s\n" "$status" > "$folder/status.txt"
            shasum -a 256 --quiet -c qualification/inputs.sha256
            shasum -a 256 --quiet -c "$RUNNER_TEMP/vertical-text-chrome.sha256"
            if [ "$status" -ne 0 ]; then failed="$status"; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-svg-font-definitions-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release the frozen macOS browser
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Vertical Text Trace Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Vertical Text Trace Chrome.app"
          fi
