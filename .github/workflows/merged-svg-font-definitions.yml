name: Trace SVG root masks from drawable to canvas
on:
  push:
    branches: [codex/qualify-svg-root-mask-drawable]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'alec-watts/remotion'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.3
      - run: bun ci
      - run: cd packages/web-renderer && bunx playwright install --with-deps
      - name: Freeze browser inputs
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bundle="$RUNNER_TEMP/Vertical Text Trace Chrome.app"
            ditto "/Applications/Google Chrome.app" "$bundle"
            chflags -R uchg "$bundle"
            binary="$bundle/Contents/MacOS/Google Chrome"
          else
            bundle="$RUNNER_TEMP/vertical-text-trace-chrome"
            mkdir -p "$bundle"
            cp -RL /opt/google/chrome/. "$bundle/"
            binary="$bundle/chrome"
          fi
          echo "VERTICAL_TEXT_TRACE_CHROME=$binary" >> "$GITHUB_ENV"
          find "$bundle" -type f -exec shasum -a 256 {} + > "$RUNNER_TEMP/vertical-text-chrome.sha256"
          python3 - <<'PIN'
          from pathlib import Path
          config = Path("packages/web-renderer/vitest.config.ts")
          source = config.read_text()
          marker = "channel: 'chrome',"
          assert source.count(marker) == 1
          config.write_text(source.replace(marker, marker + " executablePath: process.env.VERTICAL_TEXT_TRACE_CHROME,"))
          PIN
      - name: Compare exact serialized SVG in the DOM and on Canvas
        run: |
          drawing=packages/web-renderer/src/drawing
          mkdir -p qualification packages/web-renderer/test/__results__
          "$VERTICAL_TEXT_TRACE_CHROME" --version > qualification/chrome.txt
          shasum -a 256 "$drawing"/{calculate-transforms,mask-image,embed-registered-fonts-in-svg,turn-svg-into-drawable}.ts packages/web-renderer/src/test/{fixtures/svg-font-definition-review,native-reference,svg-root-mask-alpha.test}.tsx packages/web-renderer/vitest.config.ts packages/example/public/bangers.woff2 bun.lock > qualification/inputs.sha256
          git rev-parse HEAD^ HEAD > qualification/revisions.txt
          bunx turbo run make --filter=@remotion/web-renderer
          status=0
          (cd packages/web-renderer && bunx vitest src/test/svg-root-mask-alpha.test.tsx --run --reporter=default --reporter=json --outputFile=./test/__results__/report.json) || status=$?
          mv packages/web-renderer/test/__results__ qualification/web-renderer
          printf "%s\n" "$status" > qualification/status.txt
          shasum -a 256 --quiet -c qualification/inputs.sha256
          shasum -a 256 --quiet -c "$RUNNER_TEMP/vertical-text-chrome.sha256"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-root-mask-drawable-${{ matrix.os }}
          include-hidden-files: true
          path: qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Release the frozen macOS browser
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Vertical Text Trace Chrome.app" ]; then
            chflags -R nouchg "$RUNNER_TEMP/Vertical Text Trace Chrome.app"
          fi
